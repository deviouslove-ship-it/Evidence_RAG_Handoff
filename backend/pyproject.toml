[project]
name = "vietnamese-evidence-agent"
version = "0.1.0"
description = "Read-only Vietnamese evidence RAG backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.9,<3",
  "asyncpg>=0.29,<0.30",
  "httpx>=0.27,<0.29",
  "python-multipart>=0.0.9,<0.1",
  "pyyaml>=6.0,<7",
  "pypdfium2>=4.30,<5",
  "fpdf2>=2.8,<3",
  "olefile>=0.47,<0.48",
  "defusedxml>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<2",
  "httpx>=0.27,<0.29",
]
ocr = [
  "Pillow>=10,<12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["asyncpg", "pypdfium2", "olefile", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
